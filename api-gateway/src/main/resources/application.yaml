spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}
  profiles:
    active:
    - ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: auth-service
            uri: lb://auth-service
            
            predicates:
              - Path=/api/auth/**
            filters:
              - AddRequestHeader=X-Gateway, Dynamic
          - id: user-branch-service
            uri: lb://user-branch-service
            predicates:
              - Path=/api/users/**,/api/branches/**
            filters:
              - AddRequestHeader=X-Gateway, Dynamic
          - id: core-logistic-finance-service
            uri: lb://core-logistic-finance-service
            predicates:
              - Path=/api/finance/**,/api/pickups/**,/api/shipments/**
          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**
            filters:
              - AddRequestHeader=X-Gateway, Dynamic
          - id: ml-service-predict
            uri: ${ML_SERVICE_URL}
            predicates:
              - Path=/api/ml/predict
            filters:
              - RewritePath=/api/ml/predict, /predict


server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${HOST_IP:localhost}
  client:
    healthcheck:
      enabled: true
